The major problem that the HBase data-model helps us to solve here is to efficiently lookup for data by row-keys when there are 100s of millions or even billions of row-keys. You can refer to the official [HBase Docs](https://hbase.apache.org/docs/datamodel) for more info on this. Also refer to [this blog post](https://arjunagarwal-tech.medium.com/hbase-architecture-e5ccb49b87a4) for a quick guide on HBase Architecture.


Apache Phoenix on the other hand is a query-engine that sits on top of Apache HBase and provides support for managing the data within HBase as SQL queries. It provides a JDBC connector which makes working with HBase as simple as writing plain SQL queries. However, its not a replacement for MySQL/PostgreSQL which are Online-Transaction Processing (OLTP) databases. Instead Phoenix makes interacting with HBase easier by providing SQL as an abstraction. Otherwise, performing operations on HBase will require writing complex Map-Reduce jobs and designing of secondary indexes.


## Apache Phoenix in action


Let's try to locally run HBase and Phoenix. To run Phoenix you need to have an older Java version, e.g. Java 11. So setup Java first. Then you can follow the [HBase docs](https://hbase.apache.org/docs/getting-started#quick-start---standalone-hbase) to setup HBase first. And then setup Phoenix using its [docs](https://phoenix.apache.org/docs/installation). You may take help from Gemini/ChatGPT to debug any issues that you may face.


Once you're able to open Phoenix sqlline, you can run the following SQL query to create a table:

<pre>
<code class='sql'>
CREATE TABLE fleet_telemetry
(\n
&nbsp;&nbsp;vehicle_id VARCHAR NOT NULL,\n
&nbsp;&nbsp;timestamp TIMESTAMP NOT NULL,\n
&nbsp;&nbsp;speed DOUBLE,\n
&nbsp;&nbsp;status VARCHAR\n
&nbsp;&nbsp;CONSTRAINT pk PRIMARY KEY (vehicle_id, timestamp)\n
);
</code>
</pre>


Behind the scenes, Phoenix creates a unified HBase Row Key string by concatenating the primary key columns into a single stream of byts: `[vehicle_id] + [timestamp]`. This makes data access faster when querying metrics sequentially for a individual row by primary key, but because the layout forces a single sorting vector, it requires other optimizations to support filtering by non-primary keys, joins etc.


## Programatic usage of Phoenix


Now let's try to write a Java ingestion program to write a few rows to the local Phoenix node & read back data from it. It will help us in building an understanding of the code-level abstraction that Phoenix provides us. To run all the examples given below I downgraded the Java version to JDK Version 11 temporarily, and also ensured that the phoenix-client JARs are available in the classpath.


The program below demonstrates real-time data streaming logic. A critical structural difference when interacting with Phoenix is how it orchestrates memory caching via batch buffering blocks.


#### Code (FleetManagement.java)

<pre>
<code class='java'>
package org.sundeep.phoenix;\n
\n
import java.sql.*;\n
import java.util.Random;\n
\n
public class FleetManagement {\n
\n
&nbsp;&nbsp;private static final String JDBC_URL = \"jdbc:phoenix:localhost:2181:/hbase\";\n
\n
&nbsp;&nbsp;public static void main(String[] args) {\n
&nbsp;&nbsp;&nbsp;&nbsp;System.out.println(\"&nbsp;Starting IoT Fleet Ingestion & Read Test...\");\n
\n
&nbsp;&nbsp;&nbsp;&nbsp;try {\n
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Class.forName(\"org.apache.phoenix.jdbc.PhoenixDriver\");\n
&nbsp;&nbsp;&nbsp;&nbsp;} catch (ClassNotFoundException e) {\n
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;System.err.println(\"&nbsp;Phoenix Driver not found in classpath! Add the client JAR.\");\n
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;e.printStackTrace();\n
&nbsp;&nbsp;&nbsp;&nbsp;}\n
\n
&nbsp;&nbsp;&nbsp;&nbsp;try (Connection conn = DriverManager.getConnection(JDBC_URL)) {\n
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;System.out.println(\"&nbsp;Successfully connected to local Apache Phoenix over HBase!\");\n
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;writeRandomData(conn);\n
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;readDataBack(conn);\n
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;fetchSpeedingVehicles(conn);\n
&nbsp;&nbsp;&nbsp;&nbsp;} catch (Exception e) {\n
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;System.err.println(\"&nbsp;Database operation failed:\");\n
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;e.printStackTrace();\n
&nbsp;&nbsp;&nbsp;&nbsp;}\n
&nbsp;&nbsp;}\n
\n
&nbsp;&nbsp;private static void writeRandomData(Connection conn) throws Exception {\n
&nbsp;&nbsp;&nbsp;&nbsp;String upsertSql = \"UPSERT INTO fleet_telemetry (vehicle_id, timestamp, speed, status) VALUES (?, ?, ?, ?)\";\n
&nbsp;&nbsp;&nbsp;&nbsp;Random rand = new Random();\n
&nbsp;&nbsp;&nbsp;&nbsp;String[] statuses = {\"NORMAL\", \"SPEEDING\", \"IDLE\", \"OVERHEATING\"};\n
\n
&nbsp;&nbsp;&nbsp;&nbsp;System.out.println(\"\\n&nbsp;Writing random entries to 'fleet_telemetry'...\");\n
\n
&nbsp;&nbsp;&nbsp;&nbsp;try (PreparedStatement pstmt = conn.prepareStatement(upsertSql)) {\n
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;for (int i = 1; i <= 3; i++) {\n
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;String truckId = \"TRUCK-0\" + rand.nextInt(10);\n
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Timestamp now = new Timestamp(System.currentTimeMillis());\n
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;double speed = 20.0 + (rand.nextDouble() * 70.0);\n
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;String status = speed > 70 ? statuses[1] : statuses[rand.nextInt(statuses.length)];\n
\n
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;pstmt.setString(1, truckId);\n
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;pstmt.setTimestamp(2, now);\n
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;pstmt.setDouble(3, speed);\n
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;pstmt.setString(4, status);\n
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;pstmt.executeUpdate();\n
\n
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;System.out.printf(\"&nbsp;&nbsp;&nbsp;[UPSERTED] %s | %s | Speed: %.2f km/h | Status: %s\\n\",\n
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;truckId, now, speed, status);\n
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Thread.sleep(100);\n
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;}\n
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;conn.commit();\n
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;System.out.println(\"&nbsp;Transaction committed successfully to HBase storage layers.\");\n
&nbsp;&nbsp;&nbsp;&nbsp;}\n
&nbsp;&nbsp;}\n
\n
&nbsp;&nbsp;private static void readDataBack(Connection conn) throws Exception {\n
&nbsp;&nbsp;&nbsp;&nbsp;String selectSQL = \"SELECT vehicle_id, timestamp, speed, status FROM fleet_telemetry ORDER BY timestamp DESC LIMIT 10\";\n
&nbsp;&nbsp;&nbsp;&nbsp;System.out.println(\"\\n&nbsp;Reading entries back from Apache Phoenix using SQL...\");\n
\n
&nbsp;&nbsp;&nbsp;&nbsp;try (PreparedStatement pstmt = conn.prepareStatement(selectSQL)) {\n
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;ResultSet rs = pstmt.executeQuery();\n
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;System.out.println(\"-----------------------------------------------------------------------------------------\");\n
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;System.out.printf(\"%-12s | %-23s | %-12s | %-12s\\n\", \"VEHICLE_ID\", \"TIMESTAMP\", \"SPEED (km/h)\", \"STATUS\");\n
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;System.out.println(\"-----------------------------------------------------------------------------------------\");\n
\n
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;int count = 0;\n
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;while (rs.next()) {\n
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;String vehicleId = rs.getString(\"vehicle_id\");\n
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Timestamp ts = rs.getTimestamp(\"timestamp\");\n
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;double speed = rs.getDouble(\"speed\");\n
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;String status = rs.getString(\"status\");\n
\n
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;System.out.printf(\"%-12s | %-23s | %-12.2f | %-12s\\n\", vehicleId, ts, speed, status);\n
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;count++;\n
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;}\n
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;System.out.println(\"-----------------------------------------------------------------------------------------\");\n
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;System.out.printf(\"&nbsp;Total records retrieved in this query scan: %d\\n\", count);\n
&nbsp;&nbsp;&nbsp;&nbsp;}\n
&nbsp;&nbsp;}\n
\n
&nbsp;&nbsp;private static void fetchSpeedingVehicles(Connection conn) throws Exception {\n
&nbsp;&nbsp;&nbsp;&nbsp;String selectSQL = \"SELECT vehicle_id, timestamp, speed, status \" +\n
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;\"FROM fleet_telemetry \" +\n
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;\"WHERE speed > 70.0 \" +\n
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;\"ORDER BY timestamp DESC LIMIT 10\";\n
\n
&nbsp;&nbsp;&nbsp;&nbsp;System.out.println(\"\\n&nbsp;Fetching SPEEDING vehicles from Apache Phoenix (Speed > 70 km/h)...\");\n
&nbsp;&nbsp;&nbsp;&nbsp;try (PreparedStatement pstmt = conn.prepareStatement(selectSQL);\n
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;ResultSet rs = pstmt.executeQuery()) {\n
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;System.out.println(\"-----------------------------------------------------------------------------------------\");\n
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;System.out.printf(\"%-12s | %-23s | %-12s | %-12s\\n\", \"VEHICLE_ID\", \"TIMESTAMP\", \"SPEED (km/h)\", \"STATUS\");\n
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;System.out.println(\"-----------------------------------------------------------------------------------------\");\n
\n
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;int count = 0;\n
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;while (rs.next()) {\n
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;String vehicleId = rs.getString(\"vehicle_id\");\n
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Timestamp ts = rs.getTimestamp(\"timestamp\");\n
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;double speed = rs.getDouble(\"speed\");\n
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;String status = rs.getString(\"status\");\n
\n
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;System.out.printf(\"%-12s | %-23s | %-12.2f | %-12s\\n\", vehicleId, ts, speed, status);\n
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;count++;\n
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;}\n
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;System.out.println(\"-----------------------------------------------------------------------------------------\");\n
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;System.out.printf(\"&nbsp;Total speeding records retrieved: %d\\n\", count);\n
&nbsp;&nbsp;&nbsp;&nbsp;}\n
&nbsp;&nbsp;}\n
}\n
</code>
</pre>


In the code above, `pstmt.executeUpdate()` and `conn.commit()` handle distinctly decoupled tasks. When you fire `executeUpdate()`, **no data passes across the network**. Phoenix converts the SQL data into raw bytes and holds them inside an internal client-side RAM cache buffer. `conn.commit()` is the mandatory execution trigger that flushes this batched accumulation over the network, grouping payloads efficiently into unified HBase Write-Ahead Logs (WALs) and HFiles.


