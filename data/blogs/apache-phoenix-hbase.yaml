#### Code (FleetManagement.java)

<pre>
<code class='java'>
package org.sundeep.phoenix;\n
\n
import java.sql.Connection;\n
import java.sql.DriverManager;\n
import java.sql.PreparedStatement;\n
import java.sql.Timestamp;\n
import java.util.Random;\n
\n
public class FleetManagement {\n
&nbsp;&nbsp;private static final String JDBC_URL = \"jdbc:phoenix:localhost:2181:/hbase\";\n
\n
&nbsp;&nbsp;public static void main(String[] args) {\n
&nbsp;&nbsp;&nbsp;&nbsp;System.out.println(\"&nbsp;Starting IoT Fleet Ingestion & Read Test...\");\n
\n
&nbsp;&nbsp;&nbsp;&nbsp;try {\n
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Class.forName(\"org.apache.phoenix.jdbc.PhoenixDriver\");\n
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;try (Connection conn = DriverManager.getConnection(JDBC_URL)) {\n
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;writeTelemetry(conn);\n
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;}\n
&nbsp;&nbsp;&nbsp;&nbsp;} catch (Exception e) {\n
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;e.printStackTrace();\n
&nbsp;&nbsp;&nbsp;&nbsp;}\n
&nbsp;&nbsp;}\n
\n
&nbsp;&nbsp;private static void writeTelemetry(Connection conn) throws Exception {\n
&nbsp;&nbsp;&nbsp;&nbsp;String sql = \"UPSERT INTO fleet_telemetry VALUES (?, ?, ?, ?)\";\n
&nbsp;&nbsp;&nbsp;&nbsp;try (PreparedStatement pstmt = conn.prepareStatement(sql)) {\n
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Random rand = new Random();\n
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;for (int i = 1; i <= 3; i++) {\n
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;pstmt.setString(1, \"TRUCK-0\" + rand.nextInt(10));\n
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;pstmt.setTimestamp(2, new Timestamp(System.currentTimeMillis()));\n
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;pstmt.setDouble(3, 40.0 + (rand.nextDouble() * 50.0));\n
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;pstmt.setString(4, \"NORMAL\");\n
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;pstmt.executeUpdate();\n
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;}\n
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;conn.commit();\n
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;System.out.println(\"&nbsp;Transaction committed successfully to HBase!\");\n
&nbsp;&nbsp;&nbsp;&nbsp;}\n
&nbsp;&nbsp;}\n
}\n
</code>
</pre>

In this execution pipeline, `pstmt.executeUpdate()` and `conn.commit()` handle distinctly decoupled tasks. When you fire `executeUpdate()`, **no data passes across the network**. Phoenix converts the SQL data into raw bytes and holds them inside an internal client-side RAM cache buffer. `conn.commit()` is the mandatory execution trigger that flushes this batched accumulation over the network, grouping payloads efficiently into unified HBase Write-Ahead Logs (WALs) and HFiles.

## Server-Side Optimization Mechanics Exploded

To pull analytical data back efficiently—such as screening exclusively for speeding vehicles via a filtered query (`WHERE speed > 70.0`)—Phoenix deploys powerful underlying optimizations to prevent full database scanning constraints.


#### Essential Column Family Filters

Because the `speed` values inhabit the cell values rather than the row key string, standard NoSQL databases would stream entire row payloads across disk blocks into computer RAM just to check if the row matches. Phoenix skips this bottleneck by configuring an **Essential Column Family Filter** on the HBase Region Servers. The engine reads *only* the specific column files holding the speed attribute. If a row registers below the threshold, it is dropped immediately on the server, saving significant disk I/O and network bandwidth.


#### Distributed Merge Sorting

When executing sorted groupings across multiple entities (`ORDER BY timestamp DESC LIMIT 10`), Phoenix avoids loading the complete table footprint into memory to execute a sort routine. Since our composite row key structure ensures data is pre-sorted on disk *within individual vehicle scopes*, Phoenix coordinates a parallel **Merge Sort** directly via server hooks. The remote storage servers pull only the top ten records from each distinct truck subset, streaming tiny pre-sorted responses back to the client application where they are merged seamlessly in milliseconds.


#### Secondary Indexes

If your analytical queries require constant, high-speed filtering by non-primary variables, full table scanning passes can be eliminated entirely by provisioning a **Secondary Index**:

```sql
CREATE INDEX idx_fleet_speed ON fleet_telemetry (speed) INCLUDE (status);
```

When this statement compiles, Phoenix builds an asynchronous, hidden shadow table where the HBase Row Key layout is structurally inverted: `[speed] + [vehicle_id] + [timestamp]`. The query optimizer dynamically detects this shadow table, intercepting incoming SQL requests and translating them from a sequential full table lookup into a precise, sub-millisecond **HBase Range Scan**.


#### Coprocessors: Bringing Code to the Data

The functional backbone executing these server-side data extractions is the HBase Coprocessor layer. Functioning as database-native triggers and distributed stored procedures, coprocessors allow custom runtime classes to execute concurrently right alongside physical disk files. By moving the evaluation logic directly onto the storage machines, mass aggregations execute at scale without flooding client network pipes, unlocking high-performance analytical warehousing capabilities on top of a low-latency NoSQL engine.


