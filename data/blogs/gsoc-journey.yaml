description: "Here is a log of my journey from learning to code to getting selected in GSOC' 21."
content: "## What is Google Summer of Code (GSOC)\n\nFor all of you who don't know what GSOC is, \"Google Summer of Code is a global program focused on <b>introducing students to open source software development</b>\". To know more about the selection procedure, eligibility criteria please visit [the official site](https://summerofcode.withgoogle.com/).\n\n## My experience\n### Learning to code\nGoing back to the time when I joined college, I knew C++ as it was taught in our school and apart from that some bits of HTML, CSS and Javascript. After learning these basics I started searching for resources to upgrade my skills to the next level. So I searched for some resources to upgrade my skills. And I found [this](https://fullstackopen.com/en/). Following the course and some other online material and creating side-projects helped me sharpen my skills. Once I had enough confidence on my skills, I started contributing to some of my college societies as a web developer. So by the end of first year I had added these badges to my skillset😛.\n\n<img src=\"https://upload.wikimedia.org/wikipedia/commons/thumb/6/61/HTML5_logo_and_wordmark.svg/1200px-HTML5_logo_and_wordmark.svg.png\" width=\"50\" height=\"50\" />\n<img src=\"https://upload.wikimedia.org/wikipedia/commons/thumb/d/d5/CSS3_logo_and_wordmark.svg/1200px-CSS3_logo_and_wordmark.svg.png\" width=\"40\" height=\"50\" />\n<img src=\"https://html5hive.org/wp-content/uploads/2014/06/js_800x800.jpg\" width=\"50\" height=\"50\" />\n<img src=\"https://pbs.twimg.com/profile_images/446356636710363136/OYIaJ1KK.png\" width=\"50\" height=\"50\" />\n<img src=\"https://yt3.ggpht.com/ytc/AAUvwnimeZWGnUupgmWWWolhOue7CF5iTroBOSqXuLs0KQ=s900-c-k-c0x00ffffff-no-rj\" width=\"50\" height=\"50\" />\n<img src=\"https://upload.wikimedia.org/wikipedia/commons/thumb/2/29/Postgresql_elephant.svg/1200px-Postgresql_elephant.svg.png\" width=\"50\" height=\"50\" />\n<img src=\"https://cdn.iconscout.com/icon/free/png-512/node-js-1-1174935.png\" width=\"50\" height=\"50\" />\n<img src=\"https://upload.wikimedia.org/wikipedia/commons/1/18/ISO_C%2B%2B_Logo.svg\" width=\"50\" height=\"50\" />\n\n\n### Contributing to open-source\nEntering my second year, I also started contributing to some of the open-source projects built using the MERN Stack. I started contributing to the [p5.js-web-editor\n](https://github.com/processing/p5.js-web-editor). Contributing to this project helped me boost my confidence of working with large codebases and gave some insights into the development workflow as well. Honestly speaking, it is quite overwhelming at first to get started, when you see such a huge codebase. So my way to prevent this was that I focussed my attention on a small component in the entire codebase. From there I started working on fixing bugs and eventually understanding how different bits and pieces are combined to make the entire software work.  Apart from that I also started contributing to the [EOS-User-Story](https://github.com/EOS-uiux-Solutions/user-story) project. As the User-story project is relatively younger and it used [strapi](https://strapi.io/) (a headless cms, something which I was quite curious about), to power its backend, I was interested in the project. (And FYI the the backend powering this blog is strapi, as well😉). I contributed several new features to the project, including profile picture change, and update password.\n\n### Getting selected in GSOC\nWhen the GSOC projects were announced I started working on my project proposal for [EOS-User-Story project](https://github.com/EOS-uiux-Solutions/user-story). I discussed the improvements with my mentors and submitted the final proposal. And finally when the results were announced I was one of the 5 people selected. Just in case if you're curious then checkout my project [here](https://summerofcode.withgoogle.com/projects/#4638070252503040).\n\n### The GSOC Community Bonding period\nThe GSOC Community Bonding period was superb. I got to know my mentors, and my fellow mentees well. We worked on migrating the project repositories from Gitlab to Github. I worked on configuring Github Actions to run the tests and deploy the website. Here are links to the PRs that I submitted during the community bonding period.\n- [Setup Actions for running tests & deploying the website](https://github.com/EOS-uiux-Solutions/user-story/pull/2).\n- [Setup Github action for Deploying to GHCR](https://github.com/EOS-uiux-Solutions/strapi/pull/1). \n\nApart from that I along with my project partner, [Harshita Mangla](https://github.com/mharshita), worked on setting up the project board and prioritising the features.\n\n### So what next??\nThis week I will be working on implementing the search feature for stories along with the Cypress tests for the feature. I'll be updating in my blog post about anything interesting that I find related to Javascript and my project in general. So stay tuned.\n\n\n"

