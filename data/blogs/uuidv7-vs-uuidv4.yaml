        \t\t&ltartifactId&gtmysql-connector-j&lt\/artifactId&gt\n
        \t\t&ltversion&gt9.5.0&lt\/version&gt\n
    \t&lt\/dependency&gt\n\n
    \t&lt!--Dependency for generating UUIDv7--&gt\n
    \t&ltdependency&gt\n
        \t\t&ltgroupId&gtcom.fasterxml.uuid&lt\/groupId&gt\n
        \t\t&ltartifactId&gtjava-uuid-generator&lt\/artifactId&gt\n
