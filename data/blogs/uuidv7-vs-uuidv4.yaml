This blog post is a note of my learnings while digging deeper on the concept. In this blog post, I'll walk you through the advantages of using UUIDv7 over UUIDv4 as primary keys in a SQL database.

## A quick primer on how MySQL stores data in disk

All databases read & write to disk in units known as pages (different from OS pages). This is because disk I/O is significantly costly & hence it is more efficient to read colocated groups of data than performing random reads/writes for individual rows. These pages are then cached in the DB memory (known as buffer pool in MySQL) to respond to subsequent queries.


MySQL's InnoDB storage engine stores the tables as B+ Trees in the disk, where the primary key column values form the keys in B+ Tree nodes. This is known as the primary index, which is used to efficiently search for records based on primary key. The storage engine is designed in such a way that the a single page (16kb in InnoDB) can accommodate an exact number of B+ Tree nodes. 


In MySQL the leaf nodes of the primary index's B-Tree contain the actual data rows. This kind of index is known as a clustered index, where the physical layout of data on the disk is ordered based on the primary key. This makes range queries in MySQL more efficient because multiple sequential rows can be read from disk with minimal Disk I\/O, but, at the same time it does other trade offs like costlier B+ Tree rebalances during page splits, 2 B+ Tree traversals in case of reading by secondary keys, etc. (Fig 3).



## Benchmarks

For benchmarking the performance difference between UUIDv4 & UUIDv7, I wrote a Java program to insert 5 million records to my local MySQL DB in batches of 10,000 records. The program is presented in the section below & I discuss the results in the following section. Performing the inserts in batches, helps us benchmark the effect of B+ Trees and minimize the effect of network calls in the reported time. 

