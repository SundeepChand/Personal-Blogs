## A quick primer on how MySQL stores data in disk:

All databases read & write to disk in units known as pages. This is because disk I/O is significantly costly & hence it is more efficient to read colocated groups of data than performing random reads/writes for individual rows. These pages are then cached in the DB memory (known as buffer pool in MySQL) to respond to subsequent queries.

MySQLs InnoDB storage engine stores the table as a B+Tree in the disk, where the primary key column values are used as the B+Tree key. This is known as the primary index, which is used to efficiently search for records based on primary key. The storage engine is designed in such a way that the a single page (16kb in InnoDB) can accommodate an exact number of B+ Tree nodes. 

In MySQL the leaf nodes of the primary index's B-Tree contain the actual data rows. This kind of index is known as a clustered index, where the physical layout of data on the disk is ordered based on the primary key. This makes range queries in MySQL more efficient because multiple sequential rows can be read from disk with minimal Disk I/O, but, at the same time it does other trade offs like costlier B+ Tree rebalances, 2 B+ Tree traversals in case of reading by secondary key (Fig 3).

