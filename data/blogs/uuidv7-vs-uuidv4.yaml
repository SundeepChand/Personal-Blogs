## Intro

I recently came across the idea of UUIDv7 being more optimal as database keys as compared to UUIDv4. This idea has been out there on the internet since more than 2 years now. The development of UUIDv7 is based on the ideas of Shopify's ULID. While both UUIDv4 & UUIDv7 are 128-bits long, UUIDv7 encodes a timestamp (with ms precision) in the most significant 48-bits. Hence, when generating IDs with UUIDv7, the IDs will be a monotonically increasing sequence. Whereas UUIDv4 is purely random.

