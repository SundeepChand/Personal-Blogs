The above steps merely scratch the surface of TLS handshake process. Refer to the [blog post](https://www.cloudflare.com/en-gb/learning/ssl/what-happens-in-a-tls-handshake/) by Cloudflare to dig deeper into the topic.


### SSL certificate verification

This is one of the most crucial steps in TLS connection establishment. It helps in preventing man-in-the-middle attacks by verifying that the server, the client is communicating with, is a legitimate one & not an imposter. During the TLS handshake process, once the sever sends the SSL certificate, client starts the verification. As part of this, the client primarily performs the following steps:

1. **Certificate Authority (CA) validation:** The client first checks whether this certificate was issued by a trusted Certificate Authority (CA). Trusted CAs are organizations that have been vetted and are included in the trust stores of operating systems and browsers. If the certificate is not signed by a CA in the client's trust store, the connection will be flagged as insecure, and users may see warnings or errors. This validation step helps prevent attackers from using self-signed or fraudulent certificates to impersonate legitimate sites.

2. **Domain validation:** The client ensures that the SSL certificate presented by the server matches the domain name it is trying to access. This is typically checked against the certificate's Common Name (CN) and Subject Alternative Name (SAN) fields.

3. **Certificate Chain Validation:** The TLS certificate is technically a digital signature which is issued by an intermediate CA for the server's domain name (www.example.com). The intermediate CA needs to sign the certificate using its private key, which is then verified by the client using the CA's public key. But if the intermediate CA's private key is compromised, then an untrusted 3rd party will be able to issue certificates to any malicious websites. To protect against this, an intermediate CA's certificate is issued by a Root CA. Root certificates are self-signed and are included in the trust stores of operating systems, browsers, and devices. Note there can be multiple intermediate CAs leading upto the root. The root CAs mostly stay offline to reduce the surface area of attacks to breach the private key, while the intermediate CA's take care of issuing certificates to end applications. In case any breach in intermediate CA, the root CA can immediately revoke the intermediate certificate, rendering every subordinate end-entity certificate invalid.

<figure style='text-align: center;'>
  <img src='https://doimages.nyc3.cdn.digitaloceanspaces.com/006Community/SSL-verification-tutorial/certificate-chain-2.png'
       alt='Certificate chain in TLS verification'
       title='Certificate chain in TLS verification (Source: digitalocean.com)'
       style='width: 60%;'>
  <figcaption>Certificate chain in TLS verification (Source: digitalocean.com)</figcaption>
</figure>


4. **Expiration Check:** Every SSL certificate has a validity period, defined by its “Not Before” and “Not After” dates. The client checks that the current date falls within this range. If the certificate is expired or not yet valid, the client will refuse the connection.


The TLS connection is successfully established only if all the above steps are validated successfully. Otherwise the connection is refused. The above section only outlines the steps involved in TLS verification from a high-level. Refer to this [blog post](https://www.digitalocean.com/community/tutorials/ssl-verification) by DigitalOcean for a more detailed information on certificate verification.



## Enabling TLS in a HTTP server

First of all we need to obtain a TLS certificate. For a production application the certificate is issued by some reputable, **broswer-trusted** Certificate Authorities (CAs) like Let's Encrypt, AWS, DigiCert, etc. But for our local testing we will use `mkcert` to generate a certificate. `mkcert` takes care of creating a 'Local Certificate Authority' on the machine & installs it into the system's truststore, which means the browser & tools like curl will recognize the certificate & won't give TLS validation errors.

First you need to install mkcert using your package manager:
<pre>
<code class=\"plaintext\">brew install mkcert</code>
</pre>


Then setup the local CA:
<pre>
<code class=\"plaintext\">
mkcert -install
</code>
</pre>

And, finally generate the certificates for localhost:
<pre>
<code class=\"plaintext\">mkcert localhost 127.0.0.1 ::1</code>
</pre>

This will generate two files i.e. `localhost+2.pem` (the certificate) & `localhost+2-key.pem` (the private key).

Then we need to write our server by loading the .pem files generated in the previous step. I've written the code for a simple HTTPs server in golang below (feel free to use any other language of your choice):
<pre>
<code class=\"go\">package main\n
\n
import (\n
&nbsp;&nbsp;\"fmt\"\n
&nbsp;&nbsp;\"log\"\n
&nbsp;&nbsp;\"net/http\"\n
)\n
\n
func main() {\n
&nbsp;&nbsp;http.HandleFunc(\"/\", func(w http.ResponseWriter, r *http.Request) {\n
&nbsp;&nbsp;&nbsp;&nbsp;w.Header().Set(\"Content-Type\", \"text/plain; charset=UTF-8\")\n
&nbsp;&nbsp;&nbsp;&nbsp;w.WriteHeader(http.StatusOK)\n
&nbsp;&nbsp;&nbsp;&nbsp;fmt.Fprintf(w, \"Hello, World!\")\n
&nbsp;&nbsp;})\n
\n
&nbsp;&nbsp;port := \":8080\"\n
&nbsp;&nbsp;log.Printf(\"Starting HTTPS server on https://localhost:%s\\n\", port)\n
\n
&nbsp;&nbsp;err := http.ListenAndServeTLS(port, \"localhost+2.pem\", \"localhost+2-key.pem\", nil)\n
&nbsp;&nbsp;if err != nil {\n
&nbsp;&nbsp;&nbsp;&nbsp;log.Fatalf(\"Failed to start HTTPS server: %v\", err)\n
&nbsp;&nbsp;}\n
}
</code>
</pre>

Run the program with the following command:
<pre>
<code class=\"plaintext\">go run main.go</code>
</pre>

Now the server is ready to handle HTTPS traffic. If you navigate to [https://localhost:8080](https://localhost:8080) in your browser you should see the webpage as below. Notice the secure section:

