## Introduction

TLS stands for Transport Layer Security, which is a security protocol designed to allow for secure communication between two parties (machines) over the internet. One of the primary use cases of TLS is to encrypt the communication between a web application & servers over the internet with HTTPS (which denotes HTTP connection implemented over TLS). While it can also be used to encrypt other communications such as email, messaging & voice over IP (VoIP).


Following are the main objectives that TLS protocol accomplishes:\n
1. **Encryption**: Hides data from third parties.
2. **Authentication**: Ensures both parties are who they claim to be, typically using digital certificates.
3. **Integrity**: Verifies that data has not been tampered with or forged during transit.


Use of TLS is essential to enable encrypted communication between client & servers over the internet. Otherwise, the unencrypted data can easily be read by unintended third parties. You definately won't want your users' private information like chats, passwords & even credit card information to be read by any 3rd party. So for any modern day software application that communicates to remote servers over the internet, use of TLS is a must have. In the following sections we will explore how TLS works, a hands-on demo to setup TLS on a server, and mutual TLS, which is an extension of TLS.


## How does TLS work?

In any client server communication that uses TLS, the first step in establising a secure TLS communication channel is the TLS handshake. This handshake is done right after the TCP connection is established with the TCP handshake. The following diagram gives a high level overview of the steps involved in a TLS handshake.

<figure style='text-align: center;'>
  <img src='https://cf-assets.www.cloudflare.com/slt3lc6tev37/3wZIhjRIjfVSmCbVqkBKzb/4a7aa34324108c725dc25fc9e7c4ea4a/tls-ssl-handshake.png'
       alt='TCP & TLS handshake flow (Source: cloudflare.com)'
       title='TCP & TLS handshake flow (Source: cloudflare.com)'
       style='width: 40%;'>
  <figcaption>TCP & TLS handshake flow (Source: cloudflare.com)</figcaption>
</figure>

On a high level following are the steps in a TLS handshake:
1. Client initiates the connection with the server by sharing the protocol version, list of cipher suites & its half of Diffie-Hellman secret ().
2. Server receives client hello & it then shares it own half of Diffie-Hellman secret.
3. Using the half parts of the secrets both the client & server can now compute the symmetric key using which all the encryption will take place.
4. Server then sends its TLS Certificate which is digitally signed by a trusted Certificate Authority (CA).
5. The server sends TLS handshake Finished to client after this.
6. The client verifies the TLS Certificate with the certificate authority to ensure that the server is truly who it claims to be.
7. After the certificate is verified, client sends TLS handshake finished.

The above steps merely scratch the surface of TLS handshake process. Refer to the [blog post](https://www.cloudflare.com/en-gb/learning/ssl/what-happens-in-a-tls-handshake/) by Cloudflare to dig deeper into the topic.

You can run the following command to see the steps involved in the TLS handshake:


